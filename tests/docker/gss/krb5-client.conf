# Kerberos settings for the test client (the machine running cargo test): point KRB5_CONFIG at this
# file. The KDC container publishes its TCP port on the loopback address; UDP is not used.
[libdefaults]
 default_realm = KAREZ.TEST
 dns_lookup_kdc = false
 dns_lookup_realm = false
 dns_canonicalize_hostname = false
 rdns = false
 udp_preference_limit = 1
 # without this, MIT krb5 appends the machine's DNS search domain to a short host name such as
 # "localhost", and asks for postgres/localhost.<search domain> instead of postgres/localhost
 qualify_shortname = ""

[realms]
 KAREZ.TEST = {
  kdc = 127.0.0.1:54388
 }
