# Throwaway PostgreSQL for karez's integration tests. Everything here is test-only.
#
#   docker compose -f tests/docker/compose.yaml up -d --wait
#   KAREZ_TEST_PG=127.0.0.1:54316 cargo test -p karez-pg --test pg_integration -- --nocapture
#   docker compose -f tests/docker/compose.yaml down -v      # removes the container and the volume
#
# PostgreSQL 14 and 17 are optional profiles on ports 54314 and 54317:
#   docker compose -f tests/docker/compose.yaml --profile pg14 up -d --wait pg14
#
# The server has TLS on with a throwaway CA written to tests/docker/certs/ca-<port>.crt at every start.
# Containers and volumes are named karez-test-*, the port is bound to 127.0.0.1 only.
name: karez-test
# PostgreSQL 13, 15 and 18 are optional profiles too (ports 54313, 54315, 54318). They share this block.
x-pg-extra: &pg-extra
  entrypoint:
    - bash
    - -c
    - |
      set -e
      d=/var/lib/postgresql/ssl
      mkdir -p $$d /certs
      cd $$d
      openssl ecparam -name prime256v1 -genkey -noout -out ca.key
      openssl req -new -x509 -key ca.key -sha256 -days 30 -subj "/CN=karez-test-ca" -out ca.crt
      openssl ecparam -name prime256v1 -genkey -noout -out server.key
      openssl req -new -key server.key -subj "/CN=localhost" -out server.csr
      printf "subjectAltName=DNS:localhost,DNS:karez.test\nbasicConstraints=CA:FALSE\n" > ext.cnf
      openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 30 -sha256 -extfile ext.cnf
      chown postgres:postgres server.key server.crt
      chmod 600 server.key
      cp ca.crt /certs/ca-$${CA_PORT}.crt
      exec docker-entrypoint.sh "$$@"
    - ssl-entrypoint
  command:
    - postgres
    - -c
    - ssl=on
    - -c
    - ssl_cert_file=/var/lib/postgresql/ssl/server.crt
    - -c
    - ssl_key_file=/var/lib/postgresql/ssl/server.key
    - -c
    - hba_file=/etc/karez/pg_hba.conf
    - -c
    - password_encryption=scram-sha-256
    - -c
    - shared_buffers=256MB
    - -c
    - deadlock_timeout=500ms
    - -c
    - max_connections=100
  mem_limit: 1g
  shm_size: 256m
  healthcheck:
    test: ["CMD-SHELL", "psql -U postgres -d karez -tAc 'select 1 from seed_done' | grep -q 1"]
    interval: 3s
    timeout: 5s
    retries: 100
services:
  pg16:
    image: postgres:16
    container_name: karez-test-pg16
    entrypoint:
      - bash
      - -c
      - |
        set -e
        d=/var/lib/postgresql/ssl
        mkdir -p $$d /certs
        cd $$d
        openssl ecparam -name prime256v1 -genkey -noout -out ca.key
        openssl req -new -x509 -key ca.key -sha256 -days 30 -subj "/CN=karez-test-ca" -out ca.crt
        openssl ecparam -name prime256v1 -genkey -noout -out server.key
        openssl req -new -key server.key -subj "/CN=localhost" -out server.csr
        printf "subjectAltName=DNS:localhost,DNS:karez.test\nbasicConstraints=CA:FALSE\n" > ext.cnf
        openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 30 -sha256 -extfile ext.cnf
        chown postgres:postgres server.key server.crt
        chmod 600 server.key
        cp ca.crt /certs/ca-${KAREZ_TEST_PG16_PORT:-54316}.crt
        exec docker-entrypoint.sh "$$@"
      - ssl-entrypoint
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: karez_test_only_superuser_pw
      POSTGRES_DB: karez
      POSTGRES_INITDB_ARGS: "--auth-local=trust --auth-host=scram-sha-256"
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/ssl/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/ssl/server.key
      - -c
      - hba_file=/etc/karez/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_buffers=256MB
      - -c
      - deadlock_timeout=500ms
      - -c
      - max_connections=100
    ports:
      - "127.0.0.1:${KAREZ_TEST_PG16_PORT:-54316}:5432"
    mem_limit: 1g
    shm_size: 256m
    volumes:
      - ./pg_hba.conf:/etc/karez/pg_hba.conf:ro
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./certs:/certs
      - karez-test-pg16-data:/var/lib/postgresql/data
    healthcheck:
      # Healthy only once the init scripts have finished (the seed has been loaded).
      test: ["CMD-SHELL", "psql -U postgres -d karez -tAc 'select 1 from seed_done' | grep -q 1"]
      interval: 3s
