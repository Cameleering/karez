[package]
name = "karez"
description = "karez: database connectivity with Arrow-layout results (PostgreSQL first)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
karez-chunk = { path = "../karez-chunk" }
karez-proto-pg = { path = "../karez-proto-pg" }
karez-pg = { path = "../karez-pg" }

[lints]
workspace = true

[features]
# SASLprep for SCRAM passwords with non-ASCII characters (see karez-pg).
saslprep = ["karez-pg/saslprep"]
