[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karez"
version = "0.0.1"
description = "Placeholder reserving the name for karez, a planned database connectivity library written in Rust. No code yet."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"

[tool.setuptools]
packages = ["karez"]
